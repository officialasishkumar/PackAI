services:
  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: development
    command: go run ./cmd/api
    environment:
      API_PORT: 8080
      ALLOWED_ORIGINS: http://localhost:3000
      MONGODB_URI: mongodb://database:27017
      MONGODB_DATABASE: packsnap
      MEDIA_STORAGE_DRIVER: local
      LOCAL_MEDIA_DIR: /app/tmp/media
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongodb_data:

